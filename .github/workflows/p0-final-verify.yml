name: Temporary P0 final verification

on:
  push:
    branches:
      - ydisks-enhanced/p0-delivery-safety
    paths:
      - .github/workflows/p0-final-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format notifier files
        run: |
          set -Eeuo pipefail
          gofmt -w internal/notify/notifier.go internal/notify/notifier_events.go
          test -z "$(gofmt -l internal/notify/notifier.go internal/notify/notifier_events.go)"

      - name: Check Chinese comments
        run: go run ./tools/commentlint -mode check -root .

      - name: Check architecture
        run: go run ./tools/architecturecheck

      - name: Check OpenAPI
        run: go run ./tools/apicheck

      - name: Check documentation consistency
        run: go run ./tools/docscheck

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      - name: Run all Go tests
        run: go test ./...

      - name: Run server concurrency race tests
        run: make test-server-race

      - name: Commit formatting and remove temporary workflow
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/notify/notifier.go internal/notify/notifier_events.go
          git rm .github/workflows/p0-final-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(notify): format extracted notifier files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
