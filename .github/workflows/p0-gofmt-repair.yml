name: Temporary P0 Go formatting repair

on:
  push:
    branches:
      - ydisks-enhanced/p0-delivery-safety
    paths:
      - .github/workflows/p0-gofmt-repair.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format only the three CI-reported files
        run: |
          set -Eeuo pipefail
          gofmt -w \
            internal/db/automation_ownership_test.go \
            internal/db/card_sale_records.go \
            internal/db/card_sale_records_test.go
          test -z "$(gofmt -l \
            internal/db/automation_ownership_test.go \
            internal/db/card_sale_records.go \
            internal/db/card_sale_records_test.go)"

      - name: Recheck Chinese comments after declaration alignment
        run: go run ./tools/commentlint -mode check -root .

      - name: Check architecture dependencies
        id: architecture
        continue-on-error: true
        run: go run ./tools/architecturecheck

      - name: Check OpenAPI routes and specification
        run: go run ./tools/apicheck

      - name: Check documentation consistency
        run: go run ./tools/docscheck

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      - name: Run Go tests
        run: go test ./...

      - name: Run server concurrency smoke race
        run: make test-server-race

      - name: Enforce architecture gate after independent checks
        if: always()
        run: test "${{ steps.architecture.outcome }}" = "success"

      - name: Commit formatted files and remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/db/automation_ownership_test.go \
            internal/db/card_sale_records.go \
            internal/db/card_sale_records_test.go
          git rm .github/workflows/p0-gofmt-repair.yml
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 1
          fi
          git commit -m "style: format P0 delivery safety changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
